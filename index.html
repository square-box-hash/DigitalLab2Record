<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigitalLab2Record — CBSE Physics Practicals Companion</title>
    <meta name="description" content="Interactive Class 11 CBSE Physics lab companion: log real readings, get the observation table, step-by-step calculations, mean absolute error, best-fit graphs you can download, a viva bank and a printable record page in CBSE format." />
    <meta property="og:title" content="DigitalLab2Record — CBSE Physics Practicals Companion" />
    <meta property="og:description" content="Interactive Class 11 CBSE Physics lab companion: log real readings, get the observation table, step-by-step calculations, mean absolute error, best-fit graphs you can download, a viva bank and a printable record page in CBSE format." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f59e0b" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-stone-50 dark:bg-stone-950 text-stone-900 dark:text-stone-100 antialiased selection:bg-amber-200 selection:text-stone-900 transition-colors duration-200">
    <div id="root"></div>
    <script>
      // Resolve the theme before React mounts so the first paint is already
      // correct — no white flash at 9 pm.
      (function () {
        try {
          var pref = localStorage.getItem('cbse_theme_pref');
          if (pref !== 'light' && pref !== 'dark' && pref !== 'auto') {
            var legacy = localStorage.getItem('cbse_theme');
            pref = legacy === 'light' || legacy === 'dark' ? legacy : 'auto';
          }
          var hour = new Date().getHours();
          var night = hour < 6 || hour >= 19;
          var dark = pref === 'dark' || (pref !== 'light' && night);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
